name: Build & Publish OpenWrt IPK

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动检查懒猫官方最新版本
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建并更新当前版本的 Release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream Lazycat version & calculate cumulative package release (-1, -2, ...)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -euo pipefail
          MANIFEST="$(curl -fsSL https://dl.lazycatmicroserver.com/hclient-cli/latest-version.json)"
          UPSTREAM_VER="$(echo "$MANIFEST" | jq -r '.version')"
          if [ -z "$UPSTREAM_VER" ] || [ "$UPSTREAM_VER" = "null" ]; then
            echo "Failed to fetch upstream version" >&2
            exit 1
          fi
          PKG_VER="${UPSTREAM_VER#v}"
          echo "upstream_version=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VER" >> "$GITHUB_OUTPUT"

          TAGS="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          MAX_REL=0
          HAS_CURRENT_UPSTREAM="false"

          for t in $TAGS; do
            case "$t" in
              "v${PKG_VER}"|"v${PKG_VER}-"*)
                HAS_CURRENT_UPSTREAM="true"
                ;;
            esac
            if echo "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
              r="${t##*-}"
              if [ "$r" -gt "$MAX_REL" ]; then
                MAX_REL="$r"
              fi
            elif echo "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              if [ "$MAX_REL" -lt 1 ]; then
                MAX_REL=1
              fi
            fi
          done

          if [ "$EVENT_NAME" = "schedule" ] && [ "$FORCE_REBUILD" != "true" ]; then
            if [ "$HAS_CURRENT_UPSTREAM" = "true" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Upstream version $UPSTREAM_VER already packaged; skipping scheduled build."
              exit 0
            fi
            # Upstream released a new x.y.z version on schedule
            if [ "$MAX_REL" -lt 1 ]; then
              PKG_REL=1
            else
              PKG_REL="$MAX_REL"
            fi
          else
            # Repo update (push / workflow_dispatch): increment cumulative -1, -2, -3...
            PKG_REL=$((MAX_REL + 1))
          fi

          REL_TAG="v${PKG_VER}-${PKG_REL}"
          echo "pkg_rel=$PKG_REL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Resolved target version: ${PKG_VER}-${PKG_REL} (tag: ${REL_TAG})"

      - name: Download binaries (amd64 / arm64 / riscv64) and build OpenWrt IPK packages
        if: steps.check.outputs.should_build == 'true'
        env:
          PKG_REL: ${{ steps.check.outputs.pkg_rel }}
        run: |
          chmod +x ./scripts/ipkg-build ./scripts/build-ipk.sh
          ./scripts/build-ipk.sh

      - name: Generate Release Notes
        if: steps.check.outputs.should_build == 'true'
        run: |
          VER="${{ steps.check.outputs.upstream_version }}"
          PVER="${{ steps.check.outputs.pkg_version }}"
          PREL="${{ steps.check.outputs.pkg_rel }}"
          cat > dist/RELEASE_NOTES.md << EOF
          ## 懒猫微服 OpenWrt 客户端 + LuCI 界面 (v${PVER}-${PREL})

          - **懒猫上游内核版本**：\`${VER}\`
          - **OpenWrt 打包修订号**：\`-${PREL}\`（完整版本号：\`${PVER}-${PREL}\`）

          本版本由 GitHub Actions 自动从懒猫官方源 (\`https://dl.lazycatmicroserver.com/hclient-cli/latest-version.json\`) 拉取 **amd64 / arm64 / riscv64** 三架构服务端二进制并打包生成。

          ### 📦 架构与安装包对照表

          | 路由器架构 | 软件包文件名（均内置客户端 + 开机自启服务 + LuCI 界面） |
          | :--- | :--- |
          | **amd64 (\`x86_64\` 软路由)** | \`hclient-cli_${PVER}-${PREL}_amd64.ipk\` |
          | **arm64 (\`aarch64\` 全系路由/盒子)** | \`hclient-cli_${PVER}-${PREL}_arm64.ipk\` |
          | **riscv64 (\`RISC-V\` 64位路由)** | \`hclient-cli_${PVER}-${PREL}_riscv64.ipk\` |

          > 💡 **说明**：每个包均已完整包含客户端二进制、Procd 开机自启服务和 LuCI 界面，并通过 \`Architecture: all\` + \`preinst\` (\`uname -m\`) 校验适配各架构下所有 OpenWrt 子架构（如 \`aarch64_cortex-a53\`、\`aarch64_cortex-a72\`、\`aarch64_generic\`），无需添加 \`--force-architecture\`。

          ### 🚀 快速安装

          \`\`\`bash
          opkg update
          opkg install /tmp/hclient-cli_${PVER}-${PREL}_amd64.ipk
          \`\`\`

          ### 🔒 SHA256 校验值
          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" dist/*.ipk dist/SHA256SUMS \
            --title "Lazycat HClient OpenWrt ${TAG}" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest
